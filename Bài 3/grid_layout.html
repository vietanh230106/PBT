<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Grid Layout</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>

<div class="container">

    <header>HEADER</header>

    <section class="hero">
        HERO BANNER
    </section>

    <aside class="sidebar">
        <h3>Filters</h3>

        <label><input type="checkbox"> Laptop</label><br>
        <label><input type="checkbox"> Phone</label><br>
        <label><input type="checkbox"> Tablet</label>
    </aside>

    <main class="main-content">

        <div class="card featured">Featured Product</div>

        <div class="card">Product 1</div>
        <div class="card">Product 2</div>
        <div class="card">Product 3</div>
        <div class="card">Product 4</div>
        <div class="card">Product 5</div>

    </main>

    <aside class="ads">
        ADS
    </aside>

    <footer>
        FOOTER
    </footer>

</div>

</body>
</html>
