<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý sinh viên</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>QUẢN LÝ SINH VIÊN</h1>

    <button id="addBtn">+ Thêm sinh viên</button>

    <div class="stats">
        <h3>Tổng số sinh viên: <span id="total">0</span></h3>
        <h3>Điểm trung bình lớp: <span id="avg">0</span></h3>
    </div>

    <table>
        <thead>
            <tr>
                <th>Mã SV</th>
                <th>Họ tên</th>
                <th>Ngày sinh</th>
                <th>Lớp</th>
                <th>Điểm TB</th>
                <th>Email</th>
                <th>Thao tác</th>
            </tr>
        </thead>

        <tbody id="studentTable">
        </tbody>

    </table>

</div>

<div class="modal" id="modal">

    <div class="modal-content">

        <h2 id="formTitle">Thêm sinh viên</h2>

        <form id="studentForm">

            <input id="id" placeholder="Mã sinh viên" required>

            <input id="name" placeholder="Họ và tên" required>

            <input id="birthday" type="date" required>

            <input id="classroom" placeholder="Lớp học" required>

            <input id="score" type="number" step="0.1" required>

            <input id="email" type="email" placeholder="Email" required>

            <button type="submit">Lưu</button>

            <button type="button" id="cancelBtn">
                Hủy
            </button>

        </form>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
