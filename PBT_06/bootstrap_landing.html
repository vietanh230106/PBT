<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bootstrap Landing Page</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">

<a class="navbar-brand" href="#">Shop</a>

<button class="navbar-toggler" data-bs-toggle="collapse"
data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav me-auto">
<li class="nav-item">
<a class="nav-link" href="#">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Products</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Contact</a>
</li>
</ul>

<form class="d-flex me-3">
<input class="form-control me-2"
type="search"
placeholder="Search">
<button class="btn btn-outline-light">
Search
</button>
</form>

<button class="btn btn-warning">
🛒 Cart
</button>

</div>
</div>
</nav>

<!-- CAROUSEL -->

<div id="banner"
class="carousel slide"
data-bs-ride="carousel">

<div class="carousel-inner">

<div class="carousel-item active">
<img src="https://picsum.photos/1200/500?1"
class="d-block w-100">

<div class="carousel-caption">
<h1>Big Sale</h1>
<p>Up to 50%</p>
</div>
</div>

<div class="carousel-item">
<img src="https://picsum.photos/1200/500?2"
class="d-block w-100">

<div class="carousel-caption">
<h1>New Products</h1>
</div>
</div>

<div class="carousel-item">
<img src="https://picsum.photos/1200/500?3"
class="d-block w-100">

<div class="carousel-caption">
<h1>Hot Deals</h1>
</div>
</div>

</div>

<button class="carousel-control-prev"
data-bs-target="#banner"
data-bs-slide="prev">

<span class="carousel-control-prev-icon"></span>

</button>

<button class="carousel-control-next"
data-bs-target="#banner"
data-bs-slide="next">

<span class="carousel-control-next-icon"></span>

</button>

</div>

<!-- PRODUCTS -->

<div class="container my-5">

<div class="row g-4">

<!-- CARD 1 -->

<div class="col-12 col-md-6 col-lg-3">

<div class="card h-100">

<img src="https://picsum.photos/300/200?1"
class="card-img-top">

<div class="card-body">

<span class="badge bg-danger">
SALE
</span>

<h5 class="card-title">
Product 1
</h5>

<p class="card-text">
Price: $100
</p>

<button class="btn btn-primary"
data-bs-toggle="modal"
data-bs-target="#productModal">
Xem nhanh
</button>

</div>
</div>
</div>

<!-- Sao chép thêm 7 card -->
<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<img src="https://picsum.photos/300/200?2"
class="card-img-top">
<div class="card-body">
<span class="badge bg-danger">SALE</span>
<h5 class="card-title">Product 2</h5>
<p>$120</p>
<button class="btn btn-primary"
data-bs-toggle="modal"
data-bs-target="#productModal">
Xem nhanh
</button>
</div>
</div>
</div>

<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<img src="https://picsum.photos/300/200?3"
class="card-img-top">
<div class="card-body">
<span class="badge bg-danger">SALE</span>
<h5 class="card-title">Product 3</h5>
<p>$130</p>
<button class="btn btn-primary"
data-bs-toggle="modal"
data-bs-target="#productModal">
Xem nhanh
</button>
</div>
</div>
</div>

<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<img src="https://picsum.photos/300/200?4"
class="card-img-top">
<div class="card-body">
<span class="badge bg-danger">SALE</span>
<h5 class="card-title">Product 4</h5>
<p>$150</p>
<button class="btn btn-primary"
data-bs-toggle="modal"
data-bs-target="#productModal">
Xem nhanh
</button>
</div>
</div>
</div>

</div>
</div>

<!-- MODAL -->

<div class="modal fade"
id="productModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">
<h5>Product Detail</h5>

<button
class="btn-close"
data-bs-dismiss="modal">
</button>
</div>

<div class="modal-body">
Thông tin sản phẩm
</div>

</div>
</div>
</div>

<!-- FOOTER -->

<footer class="bg-dark text-white py-5">

<div class="container">

<div class="row">

<div class="col-md-3">
<h5>About</h5>
<p>Company info</p>
</div>

<div class="col-md-3">
<h5>Support</h5>
<p>Help Center</p>
</div>

<div class="col-md-3">
<h5>Policy</h5>
<p>Terms</p>
</div>

<div class="col-md-3">
<h5>Contact</h5>
<p>Email</p>
</div>

</div>
</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
